<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect With Me</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            /* Artsy, warm terra-cotta/rose clay gradient background */
            background: linear-gradient(135deg, #e57373 0%, #b71c1c 100%);
            color: #2c1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 420px;
            width: 100%;
            text-align: center;
            /* Gentle cream/soft rose tinted card container */
            background: rgba(253, 245, 245, 0.92);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(139, 0, 0, 0.25);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .profile-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #5d1a1a; /* Deep brick red for typography */
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .profile-subtitle {
            color: #7d4f4f; /* Muted crimson-gray text */
            font-size: 0.95rem;
            margin-bottom: 30px;
            line-height: 1.4;
        }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .link-button {
            display: block;
            padding: 16px;
            /* Soft, off-white/pale rose button */
            background-color: #fffbfb;
            color: #4a1515;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(183, 28, 28, 0.1);
            box-shadow: 0 4px 6px rgba(183, 28, 28, 0.04);
        }
        .link-button:hover {
            /* Artsy velvet red shift on hover */
            background-color: #880e4f;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(136, 14, 79, 0.25);
        }
        /* Highlighted Call to Action (Submittable Form) */
        .cta-button {
            background-color: #d32f2f; /* Vibrant, creative crimson */
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 12px rgba(211, 47, 47, 0.2);
        }
        .cta-button:hover {
            background-color: #b71c1c;
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(183, 28, 28, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="profile-title">Meatball <3 You</h1>
        <p class="profile-subtitle">Find our social media, contact details, and cat submission form below.</p>
            
            <!-- Instagram Link -->
            <a href="https://instagram.com/meatball.philly" target="_blank" class="link-button">Join the gang!</a>
            
            <!-- Contact Info / Email -->
            <a href="mailto:meatball.philly@proton.me" class="link-button">Email Meatball Directly</a>
            
            <!-- Additional Contact (Optional text or phone link) -->
            <a href="tel:+14244444356" class="link-button">Call / Text the Meat</a>
        
         <div class="links-container">
            <!-- Submittable Form (Highlighted Call to Action) -->
            <a href="https://form.jotform.com/262955699414069" target="_blank" class="link-button cta-button">Submit Cat Here</a>
             
        </div>
    </div>

</body>
</html>
